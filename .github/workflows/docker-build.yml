name: Build and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate configuration
        shell: bash
        env:
          REPO_OWNER: ${{ vars.DAGSHUB_REPO_OWNER }}
          REPO_NAME: ${{ vars.DAGSHUB_REPO_NAME }}
          MODEL_NAME: ${{ vars.MLFLOW_MODEL_NAME }}
          TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          missing=()
          [ -n "$REPO_OWNER" ] || missing+=("DAGSHUB_REPO_OWNER (repository variable)")
          [ -n "$REPO_NAME" ] || missing+=("DAGSHUB_REPO_NAME (repository variable)")
          [ -n "$MODEL_NAME" ] || missing+=("MLFLOW_MODEL_NAME (repository variable)")
          [ -n "$TOKEN" ] || missing+=("DAGSHUB_TOKEN (repository secret)")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required configuration: ${missing[*]}"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare lowercase GHCR image name
        shell: bash
        run: echo "IMAGE_NAME_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image and publish to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME_LC }}:latest
            ghcr.io/${{ env.IMAGE_NAME_LC }}:${{ github.sha }}
          build-args: |
            DAGSHUB_REPO_OWNER=${{ vars.DAGSHUB_REPO_OWNER }}
            DAGSHUB_REPO_NAME=${{ vars.DAGSHUB_REPO_NAME }}
            MLFLOW_MODEL_NAME=${{ vars.MLFLOW_MODEL_NAME }}
            DAGSHUB_USERNAME=${{ vars.DAGSHUB_USERNAME }}
          secrets: |
            dagshub_token=${{ secrets.DAGSHUB_TOKEN }}
